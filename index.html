<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AnimeZ TV</title>
  <style>
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      text-align: center;
    }
    h1 {
      color: #ff9800;
      margin-bottom: 20px;
    }
    .grid {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      justify-content: center;
    }
    .card {
      width: 160px;
      background: #1e1e1e;
      border-radius: 8px;
      overflow: hidden;
      border: 3px solid transparent;
      transition: transform 0.2s, border-color 0.2s;
    }
    .card.focused {
      border-color: #ff9800;
      transform: scale(1.08);
      box-shadow: 0 0 15px rgba(255, 152, 0, 0.6);
    }
    .card img {
      width: 100%;
      height: 220px;
      object-fit: cover;
    }
    .card p {
      padding: 8px;
      margin: 0;
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>
<body>

  <h1>مكتبة الأنمي - TV Edition</h1>
  <div id="anime-list" class="grid"></div>

  <!-- مشغل الفيديو بملء الشاشة -->
  <div id="player-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:#000; z-index:9999;">
    <iframe id="video-frame" src="" style="width:100%; height:100%; border:none;" allowfullscreen></iframe>
  </div>

  <script>
    const API_URL = 'https://animez-uxsm.onrender.com/api/home';
    let itemsData = [];
    let currentIndex = 0;

    async function loadAnime() {
      try {
        const res = await fetch(API_URL);
        const result = await res.json();
        if (result.success && result.data) {
          itemsData = result.data;
          renderList(itemsData);
        }
      } catch (err) {
        console.error('خطأ في جلب البيانات:', err);
      }
    }

    function renderList(list) {
      const container = document.getElementById('anime-list');
      container.innerHTML = '';
      list.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = `card ${index === 0 ? 'focused' : ''}`;
        card.dataset.index = index;
        card.dataset.link = item.link;
        card.innerHTML = `
          <img src="${item.image}" alt="${item.title}">
          <p>${item.title}</p>
        `;
        container.appendChild(card);
      });
    }

    async function playAnime(watchUrl) {
      const modal = document.getElementById('player-modal');
      const iframe = document.getElementById('video-frame');
      try {
        const res = await fetch(`https://animez-uxsm.onrender.com/api/watch?url=${encodeURIComponent(watchUrl)}`);
        const data = await res.json();
        if (data.success && data.embedUrl) {
          iframe.src = data.embedUrl;
          modal.style.display = 'block';
        } else {
          alert(data.message || 'تعذر جلب سيرفر المشاهدة');
        }
      } catch (err) {
        alert('خطأ في الاتصال بالسيرفر');
      }
    }

    document.addEventListener('keydown', (e) => {
      const modal = document.getElementById('player-modal');
      const iframe = document.getElementById('video-frame');
      const cards = document.querySelectorAll('.card');

      if (modal.style.display === 'block') {
        if (e.key === 'Escape' || e.keyCode === 10009 || e.keyCode === 8 || e.keyCode === 27) {
          modal.style.display = 'none';
          iframe.src = '';
          e.preventDefault();
        }
        return;
      }

      if (cards.length === 0) return;

      cards[currentIndex].classList.remove('focused');

      if (e.key === 'ArrowRight') {
        if (currentIndex > 0) currentIndex--;
      } else if (e.key === 'ArrowLeft') {
        if (currentIndex < cards.length - 1) currentIndex++;
      } else if (e.key === 'ArrowDown') {
        if (currentIndex + 4 < cards.length) currentIndex += 4;
      } else if (e.key === 'ArrowUp') {
        if (currentIndex - 4 >= 0) currentIndex -= 4;
      } else if (e.key === 'Enter') {
        const watchUrl = cards[currentIndex].dataset.link;
        if (watchUrl) playAnime(watchUrl);
      }

      cards[currentIndex].classList.add('focused');
      cards[currentIndex].scrollIntoView({ behavior: 'smooth', block: 'center' });
    });

    loadAnime();
  </script>
</body>
</html>
