<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AnimeZ TV Edition</title>
  <style>
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      text-align: center;
    }
    h1 {
      color: #ff9800;
      margin-bottom: 15px;
    }
    .search-box {
      margin: 10px auto 25px auto;
    }
    .search-box input {
      width: 60%;
      max-width: 500px;
      padding: 12px 20px;
      border-radius: 25px;
      border: 2px solid #333;
      background: #1e1e1e;
      color: #fff;
      font-size: 16px;
      text-align: center;
      outline: none;
    }
    .search-box input:focus {
      border-color: #ff9800;
    }
    #status-msg {
      font-size: 18px;
      color: #ff9800;
      margin-top: 40px;
    }
    .grid {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      justify-content: center;
    }
    .card {
      width: 160px;
      background: #1e1e1e;
      border-radius: 8px;
      overflow: hidden;
      border: 3px solid transparent;
      transition: transform 0.2s, border-color 0.2s;
    }
    .card.focused {
      border-color: #ff9800;
      transform: scale(1.08);
      box-shadow: 0 0 15px rgba(255, 152, 0, 0.6);
    }
    .card img {
      width: 100%;
      height: 220px;
      object-fit: cover;
    }
    .card p {
      padding: 8px;
      margin: 0;
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.9);
      z-index: 9999;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }
    #servers-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 400px;
      max-height: 80vh;
      overflow-y: auto;
    }
    .server-btn {
      background: #1e1e1e;
      color: #fff;
      padding: 15px;
      border-radius: 8px;
      border: 3px solid #333;
      font-size: 18px;
      text-align: center;
    }
    .server-btn.focused {
      border-color: #ff9800;
      background: #2e2e2e;
      transform: scale(1.05);
    }
    #modal-loading {
      color: #ff9800;
      font-size: 20px;
    }
  </style>
</head>
<body>

  <h1>مكتبة الأنمي - TV Edition</h1>

  <div class="search-box">
    <input type="text" id="search-input" placeholder="ابحث عن أنمي...">
  </div>

  <div id="status-msg">جاري تشغيل السيرفر السحابي، يرجى الانتظار...</div>
  <div id="anime-list" class="grid"></div>

  <div id="modal">
    <div id="modal-loading">جاري جلب السيرفرات المتاحة...</div>
    <div id="servers-container"></div>
    <iframe id="video-frame" src="" style="width:100%; height:100%; border:none; display:none;" allowfullscreen></iframe>
  </div>

  <script>
    const API_BASE = 'https://animez-uxsm.onrender.com';
    let itemsData = [];
    let filteredData = [];
    let currentIndex = 0;
    let attemptCount = 0;
    
    let appState = 'grid'; // 'grid', 'servers', 'player'
    let currentServerIndex = 0;
    let currentPlayUrl = '';

    async function loadAnime() {
      const statusMsg = document.getElementById('status-msg');
      attemptCount++;
      statusMsg.innerText = `جاري تشغيل السيرفر السحابي، يرجى الانتظار... (محاولة ${attemptCount})`;

      try {
        const res = await fetch(`${API_BASE}/api/home`);
        const contentType = res.headers.get('content-type');
        
        if (res.ok && contentType && contentType.includes('application/json')) {
          const result = await res.json();
          if (result.success && result.data && result.data.length > 0) {
            itemsData = result.data;
            filteredData = [...itemsData];
            statusMsg.style.display = 'none';
            renderList(filteredData);
            return;
          }
        }
        setTimeout(loadAnime, 4000);
      } catch (err) {
        setTimeout(loadAnime, 4000);
      }
    }

    function renderList(list) {
      const container = document.getElementById('anime-list');
      container.innerHTML = '';
      
      if (list.length === 0) {
        document.getElementById('status-msg').innerText = 'لم يتم العثور على أنميات مطابقة.';
        document.getElementById('status-msg').style.display = 'block';
        return;
      }

      list.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = `card ${index === 0 ? 'focused' : ''}`;
        card.dataset.index = index;
        card.dataset.link = item.link;
        card.innerHTML = `
          <img src="${item.image}" alt="${item.title}">
          <p>${item.title}</p>
        `;
        container.appendChild(card);
      });
      currentIndex = 0;
    }

    async function fetchServers(watchUrl) {
      appState = 'servers';
      const modal = document.getElementById('modal');
      const loader = document.getElementById('modal-loading');
      const serversContainer = document.getElementById('servers-container');
      const iframe = document.getElementById('video-frame');

      modal.style.display = 'flex';
      loader.innerText = 'جاري جلب السيرفرات المتاحة...';
      loader.style.display = 'block';
      serversContainer.innerHTML = '';
      iframe.style.display = 'none';
      iframe.src = '';

      try {
        const response = await fetch(`${API_BASE}/api/servers?url=${encodeURIComponent(watchUrl)}`);
        const data = await response.json();

        if (data.success && data.servers && data.servers.length > 0) {
          loader.style.display = 'none';
          currentPlayUrl = data.playUrl;
          renderServers(data.servers);
        } else {
          loader.innerText = 'لم يتم العثور على سيرفرات.';
        }
      } catch (err) {
        loader.innerText = 'خطأ في الاتصال بالانترنت.';
      }
    }

    function renderServers(servers) {
      const container = document.getElementById('servers-container');
      container.innerHTML = '';
      
      servers.forEach((server, index) => {
        const btn = document.createElement('div');
        btn.className = `server-btn ${index === 0 ? 'focused' : ''}`;
        btn.dataset.index = index;
        btn.innerText = `▶ ${server.name}`;
        container.appendChild(btn);
      });
      currentServerIndex = 0;
    }

    async function playSelectedServer() {
      const modal = document.getElementById('modal');
      const loader = document.getElementById('modal-loading');
      const serversContainer = document.getElementById('servers-container');
      const iframe = document.getElementById('video-frame');

      serversContainer.innerHTML = '';
      loader.innerText = 'جاري تحميل الفيديو...';
      loader.style.display = 'block';
      appState = 'player';

      try {
        const response = await fetch(`${API_BASE}/api/watch?url=${encodeURIComponent(currentPlayUrl)}`);
        const data = await response.json();

        if (data.success && data.embedUrl) {
          loader.style.display = 'none';
          iframe.src = data.embedUrl;
          iframe.style.display = 'block';
        } else {
          loader.style.display = 'none';
          iframe.src = currentPlayUrl;
          iframe.style.display = 'block';
        }
      } catch (err) {
        loader.style.display = 'none';
        iframe.src = currentPlayUrl;
        iframe.style.display = 'block';
      }
    }

    // تفعيل البحث فقط عند الكتابة العادية من لوحة المفاتيح
    document.getElementById('search-input').addEventListener('input', (e) => {
      const query = e.target.value.toLowerCase().trim();
      filteredData = itemsData.filter(item => item.title.toLowerCase().includes(query));
      renderList(filteredData);
    });

    // التحكم الأساسي بالريموت كنترول مع منع القفز إلى حقل البحث
    document.addEventListener('keydown', (e) => {
      const modal = document.getElementById('modal');
      const iframe = document.getElementById('video-frame');
      const searchInput = document.getElementById('search-input');

      // إذا كان التركيز في خانة البحث وتم الضغط على سهم للأسفل، ننقل التركيز إلى الكروت
      if (document.activeElement === searchInput) {
        if (e.key === 'ArrowDown') {
          searchInput.blur(); // إزالة التركيز عن خانة البحث
          if (appState === 'grid') {
            const cards = document.querySelectorAll('.card');
            if (cards.length > 0) {
              cards[currentIndex].classList.add('focused');
              cards[currentIndex].scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
          }
          e.preventDefault();
        }
        return; // السماح بالكتابة الطبيعية داخل خانة البحث
      }

      // 1. إذا كنا داخل مشغل الفيديو
      if (appState === 'player') {
        if (e.key === 'Escape' || e.keyCode === 10009 || e.keyCode === 8 || e.keyCode === 27) {
          modal.style.display = 'none';
          iframe.src = '';
          appState = 'grid';
          e.preventDefault();
        }
        return;
      }

      // 2. إذا كنا في قائمة اختيار السيرفرات
      if (appState === 'servers') {
        const serverBtns = document.querySelectorAll('.server-btn');
        if (serverBtns.length === 0) return;

        if (e.key === 'Escape' || e.keyCode === 10009 || e.keyCode === 8 || e.keyCode === 27) {
          modal.style.display = 'none';
          appState = 'grid';
          e.preventDefault();
          return;
        }

        serverBtns[currentServerIndex].classList.remove('focused');

        if (e.key === 'ArrowDown') {
          if (currentServerIndex < serverBtns.length - 1) currentServerIndex++;
        } else if (e.key === 'ArrowUp') {
          if (currentServerIndex > 0) currentServerIndex--;
        } else if (e.key === 'Enter' || e.keyCode === 13) {
          playSelectedServer();
          e.preventDefault();
          return;
        }

        serverBtns[currentServerIndex].classList.add('focused');
        serverBtns[currentServerIndex].scrollIntoView({ behavior: 'smooth', block: 'center' });
        e.preventDefault();
        return;
      }

      // 3. الشاشة الرئيسية (قائمة الأنميات)
      const cards = document.querySelectorAll('.card');
      if (cards.length === 0) return;

      cards[currentIndex].classList.remove('focused');

      if (e.key === 'ArrowRight') {
        if (currentIndex > 0) currentIndex--;
      } else if (e.key === 'ArrowLeft') {
        if (currentIndex < cards.length - 1) currentIndex++;
      } else if (e.key === 'ArrowDown') {
        if (currentIndex + 4 < cards.length) {
          currentIndex += 4;
        }
      } else if (e.key === 'ArrowUp') {
        if (currentIndex - 4 >= 0) {
          currentIndex -= 4;
        } else {
          // إذا كان في السطر الأول وضغط سهم لأعلى، ننتقل إلى خانة البحث
          searchInput.focus();
          cards[currentIndex].classList.remove('focused');
          e.preventDefault();
          return;
        }
      } else if (e.key === 'Enter' || e.keyCode === 13) {
        const watchUrl = cards[currentIndex].dataset.link;
        if (watchUrl) {
          fetchServers(watchUrl);
        }
        e.preventDefault();
        return;
      }

      cards[currentIndex].classList.add('focused');
      cards[currentIndex].scrollIntoView({ behavior: 'smooth', block: 'center' });
      e.preventDefault();
    });

    loadAnime();
  </script>
</body>
</html>
