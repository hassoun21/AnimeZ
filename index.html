<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AnimeZ TV Edition</title>
  <style>
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      text-align: center;
    }
    h1 {
      color: #ff9800;
      margin-bottom: 15px;
    }
    .search-box {
      margin: 10px auto 25px auto;
    }
    .search-box input {
      width: 60%;
      max-width: 500px;
      padding: 12px 20px;
      border-radius: 25px;
      border: 2px solid #333;
      background: #1e1e1e;
      color: #fff;
      font-size: 16px;
      text-align: center;
      outline: none;
    }
    .search-box input:focus {
      border-color: #ff9800;
    }
    #status-msg {
      font-size: 18px;
      color: #ff9800;
      margin-top: 40px;
    }
    .grid {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      justify-content: center;
    }
    .card {
      width: 160px;
      background: #1e1e1e;
      border-radius: 8px;
      overflow: hidden;
      border: 3px solid transparent;
      transition: transform 0.2s, border-color 0.2s;
    }
    .card.focused {
      border-color: #ff9800;
      transform: scale(1.08);
      box-shadow: 0 0 15px rgba(255, 152, 0, 0.6);
    }
    .card img {
      width: 100%;
      height: 220px;
      object-fit: cover;
    }
    .card p {
      padding: 8px;
      margin: 0;
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #player-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000;
      z-index: 9999;
    }
    #player-loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #ff9800;
      font-size: 22px;
    }
  </style>
</head>
<body>

  <h1>مكتبة الأنمي - TV Edition</h1>

  <div class="search-box">
    <input type="text" id="search-input" placeholder="ابحث عن أنمي...">
  </div>

  <div id="status-msg">جاري تشغيل السيرفر السحابي، يرجى الانتظار...</div>
  <div id="anime-list" class="grid"></div>

  <div id="player-modal">
    <div id="player-loading">جاري فتح صفحة المشاهدة...</div>
    <iframe id="video-frame" src="" style="width:100%; height:100%; border:none; display:none;" allowfullscreen></iframe>
  </div>

  <script>
    const API_BASE = 'https://animez-uxsm.onrender.com';
    let itemsData = [];
    let filteredData = [];
    let currentIndex = 0;
    let attemptCount = 0;

    async function loadAnime() {
      const statusMsg = document.getElementById('status-msg');
      attemptCount++;
      statusMsg.innerText = `جاري تشغيل السيرفر السحابي، يرجى الانتظار... (محاولة ${attemptCount})`;

      try {
        const res = await fetch(`${API_BASE}/api/home`);
        const contentType = res.headers.get('content-type');
        
        if (res.ok && contentType && contentType.includes('application/json')) {
          const result = await res.json();
          if (result.success && result.data && result.data.length > 0) {
            itemsData = result.data;
            filteredData = [...itemsData];
            statusMsg.style.display = 'none';
            renderList(filteredData);
            return;
          }
        }
        setTimeout(loadAnime, 4000);
      } catch (err) {
        setTimeout(loadAnime, 4000);
      }
    }

    function renderList(list) {
      const container = document.getElementById('anime-list');
      container.innerHTML = '';
      
      if (list.length === 0) {
        document.getElementById('status-msg').innerText = 'لم يتم العثور على أنميات مطابقة.';
        document.getElementById('status-msg').style.display = 'block';
        return;
      }

      list.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = `card ${index === 0 ? 'focused' : ''}`;
        card.dataset.index = index;
        card.dataset.link = item.link;
        card.innerHTML = `
          <img src="${item.image}" alt="${item.title}">
          <p>${item.title}</p>
        `;
        container.appendChild(card);
      });
      currentIndex = 0;
    }

    async function playAnime(watchUrl) {
      const modal = document.getElementById('player-modal');
      const loader = document.getElementById('player-loading');
      const iframe = document.getElementById('video-frame');

      modal.style.display = 'block';
      loader.innerText = 'جاري تحميل المشغل...';
      loader.style.display = 'block';
      iframe.style.display = 'none';
      iframe.src = '';

      try {
        const response = await fetch(`${API_BASE}/api/watch?url=${encodeURIComponent(watchUrl)}`);
        const data = await response.json();

        if (data.success && data.embedUrl) {
          loader.style.display = 'none';
          iframe.src = data.embedUrl;
          iframe.style.display = 'block';
        } else {
          // في حال فشل الـ API، نستخدم رابط الصفحة مباشرة كبديل نهائي
          loader.style.display = 'none';
          iframe.src = watchUrl.replace('watch.php', 'play.php');
          iframe.style.display = 'block';
        }
      } catch (err) {
        loader.style.display = 'none';
        iframe.src = watchUrl.replace('watch.php', 'play.php');
        iframe.style.display = 'block';
      }
    }

    document.getElementById('search-input').addEventListener('input', (e) => {
      const query = e.target.value.toLowerCase().trim();
      filteredData = itemsData.filter(item => item.title.toLowerCase().includes(query));
      renderList(filteredData);
    });

    document.addEventListener('keydown', (e) => {
      const modal = document.getElementById('player-modal');
      const iframe = document.getElementById('video-frame');
      const cards = document.querySelectorAll('.card');

      if (modal.style.display === 'block') {
        if (e.key === 'Escape' || e.keyCode === 10009 || e.keyCode === 8 || e.keyCode === 27) {
          modal.style.display = 'none';
          iframe.src = '';
          e.preventDefault();
        }
        return;
      }

      if (cards.length === 0) return;

      cards[currentIndex].classList.remove('focused');

      if (e.key === 'ArrowRight') {
        if (currentIndex > 0) currentIndex--;
      } else if (e.key === 'ArrowLeft') {
        if (currentIndex < cards.length - 1) currentIndex++;
      } else if (e.key === 'ArrowDown') {
        if (currentIndex + 4 < cards.length) currentIndex += 4;
      } else if (e.key === 'ArrowUp') {
        if (currentIndex - 4 >= 0) currentIndex -= 4;
      } else if (e.key === 'Enter') {
        const watchUrl = cards[currentIndex].dataset.link;
        if (watchUrl) playAnime(watchUrl);
      }

      cards[currentIndex].classList.add('focused');
      cards[currentIndex].scrollIntoView({ behavior: 'smooth', block: 'center' });
    });

    loadAnime();
  </script>
</body>
</html>
