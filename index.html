<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تطبيق الأنمي - AnimeZid</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #121212; color: #fff; padding: 20px; margin: 0; }
        h1 { text-align: center; color: #ff9800; margin-bottom: 20px; }
        
        .search-container { text-align: center; margin-bottom: 30px; }
        .search-container input {
            width: 50%;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 25px;
            border: none;
            outline: none;
            background: #1e1e1e;
            color: #fff;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
        .card { background: #1e1e1e; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 8px rgba(0,0,0,0.3); text-align: center; padding-bottom: 10px; transition: transform 0.2s; }
        .card:hover { transform: translateY(-5px); }
        .card img { width: 100%; height: 280px; object-fit: cover; }
        .card h3 { font-size: 14px; padding: 10px; margin: 0; height: 40px; overflow: hidden; }
        .card a { display: block; margin-top: 10px; color: #4CAF50; text-decoration: none; font-weight: bold; }
        .card a:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <h1>قائمة الأنميات المضافة حديثاً</h1>

    <div class="search-container">
        <input type="text" id="search-input" placeholder="ابحث عن أي أنمي بالاسم..." onkeyup="filterAnime()">
    </div>

    <div class="grid" id="anime-container">جاري تحميل الأنميات...</div>

    <script>
        let allAnimeData = [];

        fetch('https://animez-uxsm.onrender.com/api/home')
            .then(res => res.json())
            .then(data => {
                if (data && data.success && data.data.length > 0) {
                    allAnimeData = data.data;
                    displayAnime(allAnimeData);
                } else {
                    document.getElementById('anime-container').innerHTML = '<p style="grid-column: 1/-1; text-align: center;">لم يتم العثور على أنميات.</p>';
                }
            })
            .catch(err => {
                document.getElementById('anime-container').innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: red;">حدث خطأ أثناء جلب البيانات من السيرفر.</p>';
            });

        function displayAnime(animeList) {
            const container = document.getElementById('anime-container');
            container.innerHTML = '';
            
            if (animeList.length === 0) {
                container.innerHTML = '<p style="grid-column: 1/-1; text-align: center;">لا توجد نتائج مطابقة لبحثك.</p>';
                return;
            }

            animeList.forEach(anime => {
                const animeLink = anime.link && anime.link.startsWith('http') ? anime.link : 'https://animezid.cam';
                
                container.innerHTML += `
                    <div class="card">
                        <img src="${anime.image}" alt="${anime.title}">
                        <h3>${anime.title}</h3>
                        <a href="${animeLink}" target="_blank" class="watch-btn">بدء المشاهدة</a>
                    </div>
                `;
            });
        }

        function filterAnime() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const filtered = allAnimeData.filter(anime => anime.title.toLowerCase().includes(query));
            displayAnime(filtered);
        }
    </script>

</body>
</html>
